<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes - Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>AttendTrack</h2>
            <p>School Attendance</p>
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="classes.html" class="active">Classes</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
            <a href="settings.html">Settings</a>
        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Classes</h1>
                <p>Manage school classes</p>
            </div>
        </header>

        <section class="section">

            <div class="section-header">
                <h2>Register Class</h2>
            </div>

            <form id="classForm" class="form">

                <div class="form-group">
                    <label>Class Name</label>
                    <input
                        type="text"
                        id="className"
                        placeholder="e.g. JSS 1A"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Class Teacher</label>
                    <input
                        type="text"
                        id="classTeacher"
                        placeholder="Teacher's name"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Add Class
                </button>

            </form>

        </section>

        <section class="section">

            <div class="section-header">
                <h2>Registered Classes</h2>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Class</th>
                            <th>Teacher</th>
                            <th>Students</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="classesTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
