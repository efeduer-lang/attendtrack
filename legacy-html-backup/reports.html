<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports - Attendance System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>AttendTrack</h2>
            <p>School Attendance</p>
        </div>

        <nav>

            <a href="index.html">Dashboard</a>
            <a href="classes.html">Classes</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html" class="active">
                Reports
            </a>
            <a href="settings.html">Settings</a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Attendance Reports</h1>

                <p>
                    View monthly attendance records
                </p>

            </div>

        </header>

        <section class="section">

            <div class="report-filters">

                <div class="form-group">

                    <label>Month</label>

                    <input
                        type="month"
                        id="reportMonth"
                    >

                </div>

                <div class="form-group">

                    <label>Class</label>

                    <select id="reportClass">

                        <option value="all">
                            All Classes
                        </option>

                    </select>

                </div>

                <button
                    class="btn"
                    id="generateReport"
                >
                    Generate Report
                </button>

                <button
                    class="btn secondary"
                    id="exportCSV"
                >
                    Export CSV
                </button>

            </div>

        </section>

        <section class="section">

            <div class="section-header">

                <h2>Monthly Attendance</h2>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Student ID</th>
                            <th>Student</th>
                            <th>Class</th>
                            <th>Present</th>
                            <th>Absent</th>
                            <th>Total Days</th>
                            <th>Attendance %</th>

                        </tr>

                    </thead>

                    <tbody id="reportTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
