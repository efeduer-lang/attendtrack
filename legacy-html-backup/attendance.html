<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance - Attendance System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>AttendTrack</h2>
            <p>School Attendance</p>
        </div>

        <nav>

            <a href="index.html">Dashboard</a>
            <a href="classes.html">Classes</a>
            <a href="students.html">Students</a>
            <a href="attendance.html" class="active">
                Attendance
            </a>
            <a href="reports.html">Reports</a>
            <a href="settings.html">Settings</a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Mark Attendance</h1>
                <p>Record daily student attendance</p>
            </div>

        </header>

        <section class="section">

            <div class="attendance-controls">

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        id="attendanceDate"
                    >

                </div>

                <div class="form-group">

                    <label>Class</label>

                    <select id="attendanceClass">

                        <option value="">
                            Select class
                        </option>

                    </select>

                </div>

            </div>

        </section>

        <section class="section">

            <div class="section-header">

                <h2>Student Attendance</h2>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="attendanceTable">
                    </tbody>

                </table>

            </div>

            <button
                class="btn"
                id="saveAttendance"
            >
                Save Attendance
            </button>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
